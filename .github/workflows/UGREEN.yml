name: UGREEN

on:
  workflow_dispatch:
  push:
    branches:
      - latest
    paths:
      - ugreen_version

permissions:
  contents: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend code
        uses: actions/checkout@v3
        with:
          repository: dongshull/Docker-Copilot-React
          path: './frontend'
          ref: 'master'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/package.json

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Upload Frontend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact-front-dist
          path: frontend/dist

  build-backend:
    needs: [ build-frontend ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ amd64, arm64 ]
    steps:
      - name: Checkout code back end
        uses: actions/checkout@v3

      - name: Download Frontend Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: my-artifact-front-*
          merge-multiple: true
          path: front

      - run: ls -R front

      - name: Get version from file
        id: get_version
        run: |
          echo "version=$(cat ugreen_version)" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.1'
          cache: true

      - name: Run Go tests
        run: go test ./...

      - name: Build for ${{ matrix.arch }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -a --trimpath -ldflags="-w -s -X 'github.com/onlyLTY/dockerCopilot/internal/config.Version=${{ env.version }}' -X 'github.com/onlyLTY/dockerCopilot/internal/config.BuildDate=$(date)'" -o dist/linux/${{ matrix.arch }}/dockerCopilot-new .

      - name: Compress binary
        run: |
          tar -czvf dockerCopilot-${{ matrix.arch }}.tar.gz dist/linux/${{ matrix.arch }}/dockerCopilot-new

      - name: List current directory
        run: ls -la

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bin-${{ matrix.arch }}
          path: dockerCopilot-${{ matrix.arch }}.tar.gz

  # release 只在这里创建一次；放在矩阵任务里会因 amd64/arm64 并发而建出重复 release。
  publish-release:
    needs: [ build-backend ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Get version from file
        run: |
          echo "version=$(cat ugreen_version)" >> $GITHUB_ENV

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-bin-*
          merge-multiple: true
          path: release

      - name: Create or update GitHub Release
        run: |
          if gh release view "${{ env.version }}" >/dev/null 2>&1; then
            echo "release ${{ env.version }} 已存在，直接追加产物"
          else
            gh release create "${{ env.version }}" \
              --title "${{ env.version }}" \
              --notes "Release of version ${{ env.version }}"
          fi
          gh release upload "${{ env.version }}" release/*.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
